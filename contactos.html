<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Mi Sitio Web</title>
</head>
<body>

    <!-- Encabezado y Navegación -->
    <header>
        <h1>Contacto</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="about.html">Sobre mí</a></li>
                <li><a href="contactos.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <!-- Contenido Principal -->
    <main>
        <section>
            <h2>Ponte en contacto conmigo</h2>
            <p>Si tienes alguna consulta o propuesta, puedes enviarme un mensaje mediante el siguiente formulario:</p>

            <form action="#" method="POST">
                <div>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                </div>
                <br>
                <div>
                    <label for="email">Correo Electrónico:</label><br>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                <br>
                <div>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>
                <br>
                <button type="submit">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <hr>

    <!-- Pie de Página -->
    <footer>
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
